<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne - Camino</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      max-width: 28rem;
      width: 100%;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .icon-wrapper {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      background-color: #fef2f2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon-wrapper svg {
      width: 2.25rem;
      height: 2.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease-in-out;
      width: 100%;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 1.25rem;
    }
    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background-color: #ef4444;
    }
    .status-dot.online {
      background-color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-6.364m0 0a9 9 0 012.829-6.364M3 3l18 18" />
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>Cette page n'a pas encore été mise en mémoire cache. Vérifiez votre connexion internet pour continuer à naviguer sur Camino.</p>
    <button class="btn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
      </svg>
      Réessayer
    </button>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connexion perdue</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      window.location.reload();
    }

    // Auto-refresh as soon as connectivity is restored
    window.addEventListener('online', function() {
      document.getElementById('statusDot').classList.add('online');
      document.getElementById('statusText').textContent = 'Connexion rétablie, rechargement...';
      setTimeout(function() {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
